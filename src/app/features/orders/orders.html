<app-layout>
  <div class="w-full max-w-7xl mx-auto px-0 sm:px-0">
    <!-- Orders actions header -->
    <app-orders-actions
      title="Orders"
      (searchChange)="onSearch($event)"
      (statusFilterChange)="onStatusFilterChange($event)"
      (addPackageClick)="onAddPackage()"
      (refreshClick)="onRefresh()">
    </app-orders-actions>

    <!-- Loading state -->
    <div *ngIf="isLoading()" class="flex items-center justify-center py-12">
      <div class="flex flex-col items-center gap-3">
        <svg class="animate-spin h-8 w-8 text-violet-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-sm text-gray-500 dark:text-gray-400">Loading packages...</span>
      </div>
    </div>

    <!-- Error state -->
    <div *ngIf="error() && !isLoading()" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4 mb-4">
      <div class="flex items-center gap-3">
        <svg class="h-5 w-5 text-red-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
        </svg>
        <span class="text-sm text-red-700 dark:text-red-300">{{ error() }}</span>
        <button
          (click)="onRefresh()"
          class="ml-auto text-sm text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-200 font-medium">
          Try again
        </button>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading() && !error() && transactions().length === 0" class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-12">
      <div class="flex flex-col items-center text-center">
        <svg class="h-16 w-16 text-gray-300 dark:text-gray-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-1">No packages found</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Get started by creating your first package.</p>
        <button
          (click)="onAddPackage()"
          class="inline-flex items-center gap-2 px-4 py-2 bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium rounded-lg transition-colors">
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z" />
          </svg>
          Add Package
        </button>
      </div>
    </div>

    <!-- Packages table -->
    <div *ngIf="!isLoading() && !error() && transactions().length > 0" data-tour-orders="table" class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
      <app-transaction-table
        [transactions]="pagedTransactions()"
        [selectedIds]="selectedIds()"
        [sortField]="sortField()"
        [sortDirection]="sortDirection()"
        (sortChange)="onSortChange($event)"
        (transactionSelected)="onTransactionSelected($event)"
        (selectionChanged)="onSelectionChanged($event)"
        (deleteRequested)="onDeletePackages($event)">
      </app-transaction-table>

      <!-- Pagination footer -->
      <div data-tour-orders="pagination" class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 px-4 py-3 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/60">
        <!-- Range + page size -->
        <div class="flex items-center gap-3 text-sm text-gray-600 dark:text-gray-400">
          <span>
            Showing
            <span class="font-medium text-gray-800 dark:text-gray-200">{{ pageRangeStart() }}</span>
            to
            <span class="font-medium text-gray-800 dark:text-gray-200">{{ pageRangeEnd() }}</span>
            of
            <span class="font-medium text-gray-800 dark:text-gray-200">{{ transactions().length }}</span>
          </span>
          <label class="flex items-center gap-2">
            <span class="hidden sm:inline">Per page:</span>
            <select
              [value]="pageSize()"
              (change)="onPageSizeChange($event)"
              class="form-select py-1 pl-2 pr-7 text-sm rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-violet-500 focus:border-transparent">
              @for (size of pageSizeOptions; track size) {
                <option [value]="size">{{ size }}</option>
              }
            </select>
          </label>
        </div>

        <!-- Page controls -->
        <nav class="flex items-center gap-1" aria-label="Pagination">
          <button
            type="button"
            (click)="prevPage()"
            [disabled]="currentPage() === 1"
            class="inline-flex items-center justify-center h-8 w-8 rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 disabled:opacity-40 disabled:cursor-not-allowed"
            aria-label="Previous page">
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 010 1.06L9.06 10l3.73 3.71a.75.75 0 11-1.06 1.06l-4.25-4.25a.75.75 0 010-1.06l4.25-4.25a.75.75 0 011.06 0z" clip-rule="evenodd" />
            </svg>
          </button>

          @for (p of visiblePages(); track p) {
            <button
              type="button"
              (click)="goToPage(p)"
              class="inline-flex items-center justify-center h-8 min-w-[2rem] px-2 rounded-md text-sm font-medium border"
              [class.bg-violet-600]="p === currentPage()"
              [class.text-white]="p === currentPage()"
              [class.border-violet-600]="p === currentPage()"
              [class.bg-white]="p !== currentPage()"
              [class.dark:bg-gray-800]="p !== currentPage()"
              [class.text-gray-700]="p !== currentPage()"
              [class.dark:text-gray-300]="p !== currentPage()"
              [class.border-gray-200]="p !== currentPage()"
              [class.dark:border-gray-700]="p !== currentPage()"
              [class.hover:bg-gray-50]="p !== currentPage()"
              [class.dark:hover:bg-gray-700]="p !== currentPage()">
              {{ p }}
            </button>
          }

          <button
            type="button"
            (click)="nextPage()"
            [disabled]="currentPage() === totalPages()"
            class="inline-flex items-center justify-center h-8 w-8 rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 disabled:opacity-40 disabled:cursor-not-allowed"
            aria-label="Next page">
            <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 010-1.06L10.94 10 7.21 6.29a.75.75 0 111.06-1.06l4.25 4.25a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 01-1.06 0z" clip-rule="evenodd" />
            </svg>
          </button>
        </nav>
      </div>
    </div>
  </div>

  <!-- Create Package Modal -->
  <app-create-package-modal
    [isOpen]="createPackageModalOpen"
    (closeModal)="onCloseCreatePackageModal()"
    (packageCreated)="onPackageCreated($event)"
    (viewDuplicatePackage)="onViewDuplicatePackage($event)">
  </app-create-package-modal>

  <!-- Package Details Panel -->
  <app-package-details-panel
    [isOpen]="detailsPanelOpen()"
    [package]="selectedPackage()"
    (closePanel)="onCloseDetailsPanel()"
    (updateStatus)="onUpdatePackageStatus($event)"
    (setStatus)="onSetPackageStatus($event)"
    (showQrCode)="showQrCode($event)"
    (viewPodDocument)="onViewPodDocument($event)">
  </app-package-details-panel>

  <!-- POD Document (printable) -->
  <app-pod-document
    [isOpen]="podDocumentOpen()"
    [package]="podDocumentPackage()"
    (closeModal)="onClosePodDocument()">
  </app-pod-document>

  <!-- Mark Collected (Proof of Delivery) Modal -->
  <app-mark-collected-modal
    [isOpen]="markCollectedModalOpen()"
    [package]="packageAwaitingCollection()"
    [isSubmitting]="isSubmittingCollection()"
    (closeModal)="onCloseMarkCollectedModal()"
    (confirmed)="onCollectionConfirmed($event)">
  </app-mark-collected-modal>

  <!-- Assign Driver Modal (opens whenever a package transitions to in_transit) -->
  <app-assign-driver-modal
    [isOpen]="assignDriverModalOpen()"
    [package]="packageAwaitingDriver()"
    [isSubmitting]="isAssigningDriver()"
    (closeModal)="onCloseAssignDriverModal()"
    (confirmed)="onDriverAssigned($event)">
  </app-assign-driver-modal>

  <!-- QR Code Modal -->
  <div *ngIf="qrCodeModalOpen()"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
    (click)="closeQrCodeModal()">
    <div
      class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 max-w-sm mx-4 transform transition-all"
      (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Package QR Code</h3>
        <button
          (click)="closeQrCodeModal()"
          class="p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 rounded-lg transition-colors">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
          </svg>
        </button>
      </div>
      <app-qr-code
        [data]="qrCodeData()"
        [size]="200"
        [showDownloadButton]="true"
        downloadButtonText="Download QR Code"
        label="Scan to view package details">
      </app-qr-code>
    </div>
  </div>
</app-layout>

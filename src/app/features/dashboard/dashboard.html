<app-layout>
  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6">

    <!-- Dashboard actions -->
    <app-dashboard-actions
      title="Dashboard"
      (filterApply)="onFilterApply($event)"
      (addViewClick)="onAddView()">
    </app-dashboard-actions>

    <!-- Loading state -->
    @if (isLoading()) {
      <div class="flex items-center justify-center py-12">
        <div class="flex flex-col items-center gap-3">
          <svg class="animate-spin h-8 w-8 text-violet-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-sm text-gray-500 dark:text-gray-400">Loading dashboard...</span>
        </div>
      </div>
    } @else {
      <!-- Cards -->
      <div class="grid grid-cols-12 gap-4 lg:gap-6">

        <!-- Package Stats Overview - Full Width -->
        <app-package-stats-card
          title="Package Overview"
          [stats]="statItems">
        </app-package-stats-card>

        <!-- Row 2: Trend Chart (8 cols) + Status Distribution (4 cols) -->
        <app-packages-trend-card
          cardId="packages-trend"
          title="Packages This Week"
          [chartHeight]="200"
          [data]="weeklyTimeSeries()">
        </app-packages-trend-card>

        <app-package-status-chart
          cardId="package-status"
          title="Status Distribution"
          [data]="statusDistribution()">
        </app-package-status-chart>

        <!-- Row 3: Recent Packages (8 cols) + Delivery Performance (4 cols) -->
        <app-recent-packages-card
          title="Recent Packages"
          [packages]="recentActivity()"
          (packageClick)="onPackageClick($event)"
          (viewAllClick)="onViewAllPackages()">
        </app-recent-packages-card>

        <app-delivery-performance-card
          title="Delivery Performance"
          [completedCount]="stats().completed"
          [inProgressCount]="stats().inTransit + stats().readyForCollection"
          [pendingCount]="stats().pending">
        </app-delivery-performance-card>

      </div>
    }
  </div>

  <!-- Create Package Modal -->
  <app-create-package-modal
    [isOpen]="createPackageModalOpen"
    (closeModal)="onCloseCreatePackageModal()"
    (packageCreated)="onPackageCreated($event)">
  </app-create-package-modal>
</app-layout>

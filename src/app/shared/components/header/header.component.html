<header class="sticky top-0 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 z-30">
  <div class="px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 -mb-px">

      <!-- Header: Left side -->
      <div class="flex">
        <!-- Hamburger button -->
        <button
          class="hamburger-btn text-slate-500 hover:text-slate-600 dark:hover:text-slate-400"
          (click)="toggleSidebar()"
          [attr.aria-expanded]="sidebarOpen"
          aria-controls="sidebar">
          <span class="sr-only">Open sidebar</span>
          <ng-icon name="tablerMenu2" size="24"></ng-icon>
        </button>
      </div>

      <!-- Header: Right side -->
      <div class="flex items-center space-x-3">

        <!-- Notifications button -->
        <div class="relative inline-flex">
          <button
            class="header-icon-btn relative"
            [class.active]="notificationsOpen()"
            aria-haspopup="true"
            (click)="toggleNotifications()"
            [attr.aria-expanded]="notificationsOpen()">
            <span class="sr-only">Notifications</span>
            <ng-icon name="tablerBell" size="16"></ng-icon>
            <div
              *ngIf="hasNotifications()"
              class="absolute top-0.5 right-0.5 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white dark:ring-slate-800">
            </div>
          </button>

          <div
            *ngIf="notificationsOpen()"
            class="dropdown-panel absolute top-full right-0 mt-2 w-80 -mr-48 sm:mr-0"
            (click)="$event.stopPropagation()">
            <!-- Header -->
            <div class="dropdown-panel__header">
              <ng-icon name="tablerBell" size="14"></ng-icon>
              <span>Notifications</span>
              <span class="ml-auto bg-rose-100 text-rose-600 dark:bg-rose-500/20 dark:text-rose-400 text-xs font-semibold px-1.5 py-0.5 rounded-full">{{ notifications().length }}</span>
            </div>
            <!-- Items -->
            <ul class="divide-y divide-slate-100 dark:divide-slate-700/60 max-h-72 overflow-y-auto">
              <li *ngIf="notifications().length === 0" class="px-4 py-6 text-center text-sm text-slate-400 dark:text-slate-500">
                No recent activity
              </li>
              <li *ngFor="let notification of notifications()">
                <a
                  class="dropdown-panel__notification"
                  [href]="notification.href"
                  (click)="closeAllDropdowns()">
                  <span class="dropdown-panel__notification-emoji">{{ notification.emoji }}</span>
                  <span class="min-w-0">
                    <span class="block text-sm font-medium text-slate-800 dark:text-slate-100 truncate">{{ notification.title }}</span>
                    <span class="block text-xs text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-2">{{ notification.description }}</span>
                    <span class="block text-xs text-slate-400 dark:text-slate-500 mt-1">{{ notification.date }}</span>
                  </span>
                </a>
              </li>
            </ul>
            <!-- Footer -->
            <div class="dropdown-panel__footer">
              <a routerLink="/orders" class="text-xs font-medium text-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400" (click)="closeAllDropdowns()">View all orders →</a>
            </div>
          </div>
        </div>

        <!-- Info button -->
        <div class="relative inline-flex">
          <button
            class="header-icon-btn"
            [class.active]="infoOpen()"
            aria-haspopup="true"
            (click)="toggleInfo()"
            [attr.aria-expanded]="infoOpen()">
            <span class="sr-only">Info</span>
            <ng-icon name="tablerInfoCircle" size="16"></ng-icon>
          </button>

          <div
            *ngIf="infoOpen()"
            class="dropdown-panel absolute top-full right-0 mt-2 w-52"
            (click)="$event.stopPropagation()">
            <div class="dropdown-panel__header">
              <ng-icon name="tablerHelp" size="14"></ng-icon>
              <span>Need help?</span>
            </div>
            <ul class="dropdown-panel__menu">
              <li *ngFor="let link of helpLinks">
                <!-- Documentation opens modal -->
                <button
                  *ngIf="link.icon === 'documentation'"
                  type="button"
                  class="dropdown-panel__action-item w-full text-left"
                  (click)="openDocs($event)">
                  <span class="dropdown-panel__action-icon">
                    <ng-icon name="tablerBook" size="15"></ng-icon>
                  </span>
                  <span>{{ link.text }}</span>
                </button>
                <!-- Contact us opens email client -->
                <a
                  *ngIf="link.icon === 'contact'"
                  class="dropdown-panel__action-item"
                  [href]="link.href"
                  (click)="closeAllDropdowns()">
                  <span class="dropdown-panel__action-icon">
                    <ng-icon name="tablerSend" size="15"></ng-icon>
                  </span>
                  <span>{{ link.text }}</span>
                </a>
              </li>
            </ul>
          </div>
        </div>

        <!-- Dark mode toggle -->
        <button
          type="button"
          class="header-icon-btn"
          (click)="toggleDarkMode()"
          [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
          <ng-icon *ngIf="!darkMode()" name="tablerSun" size="16"></ng-icon>
          <ng-icon *ngIf="darkMode()" name="tablerMoon" size="16"></ng-icon>
        </button>

        <!-- Divider -->
        <hr class="w-px h-6 bg-slate-200 dark:bg-slate-700 border-none">

        <!-- User button -->
        <div class="relative inline-flex">
          <button
            class="inline-flex justify-center items-center gap-2 group"
            aria-haspopup="true"
            (click)="toggleUserDropdown()"
            [attr.aria-expanded]="userDropdownOpen()">
            <img class="w-8 h-8 rounded-full ring-2 ring-transparent group-hover:ring-indigo-300 dark:group-hover:ring-indigo-500 transition-all" [src]="userAvatarSrc()" width="32" height="32" [alt]="userName()">
            <div class="hidden sm:flex items-center gap-1">
              <span class="text-sm font-medium text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-slate-100 transition-colors">{{ userName() }}</span>
              <ng-icon name="tablerChevronDown" size="12" class="text-slate-400 dark:text-slate-500 transition-transform" [class.rotate-180]="userDropdownOpen()"></ng-icon>
            </div>
          </button>

          <div
            *ngIf="userDropdownOpen()"
            class="dropdown-panel absolute top-full right-0 mt-2 w-56"
            (click)="$event.stopPropagation()">
            <!-- Profile section -->
            <div class="dropdown-panel__profile">
              <img class="w-10 h-10 rounded-full" [src]="userAvatarSrc()" width="40" height="40" [alt]="userName()">
              <div class="min-w-0">
                <div class="text-sm font-semibold text-slate-800 dark:text-slate-100 truncate">{{ userName() }}</div>
                <div class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ userEmail() }}</div>
              </div>
            </div>
            <!-- Menu items -->
            <ul class="dropdown-panel__menu">
              <li>
                <button type="button" class="dropdown-panel__action-item" (click)="onSettings($event)">
                  <span class="dropdown-panel__action-icon">
                    <ng-icon name="tablerSettings" size="15"></ng-icon>
                  </span>
                  Settings
                </button>
              </li>
              <li class="dropdown-panel__divider"></li>
              <li>
                <button type="button" class="dropdown-panel__action-item dropdown-panel__action-item--danger" (click)="onSignOut($event)">
                  <span class="dropdown-panel__action-icon dropdown-panel__action-icon--danger">
                    <ng-icon name="tablerLogout" size="15"></ng-icon>
                  </span>
                  Sign Out
                </button>
              </li>
            </ul>
          </div>
        </div>

      </div>

    </div>
  </div>
</header>

<!-- Click outside handler for dropdowns -->
<div
  *ngIf="notificationsOpen() || infoOpen()"
  class="fixed inset-0 z-30"
  (click)="closeAllDropdowns()">
</div>

<!-- Documentation modal -->
<app-docs-modal
  [isOpen]="docsOpen()"
  (closeModal)="closeDocs()">
</app-docs-modal>

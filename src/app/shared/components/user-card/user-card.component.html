<article
  class="user-card group relative flex h-full flex-col overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg dark:border-gray-700/60 dark:bg-gray-800 cursor-pointer"
  (click)="onCardClick()">

  <!-- Gradient banner -->
  <div class="h-16 w-full" [ngClass]="bannerGradientClass" aria-hidden="true"></div>

  <!-- Menu button (floats over banner) -->
  <div
    class="absolute right-3 top-3"
    (clickOutside)="closeMenu()"
    (keydown)="onMenuKeydown($event)">
    <button
      type="button"
      class="flex h-8 w-8 items-center justify-center rounded-full bg-white/25 text-white backdrop-blur-sm transition hover:bg-white/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
      [class.ring-2]="isMenuOpen"
      [class.ring-white]="isMenuOpen"
      (click)="toggleMenu($event)"
      [attr.aria-expanded]="isMenuOpen"
      [attr.aria-label]="'Open menu for ' + user.name"
      aria-haspopup="true">
      <span class="sr-only">Menu</span>
      <ng-icon name="tablerDotsVertical" size="18"></ng-icon>
    </button>

    <div
      *ngIf="isMenuOpen"
      [@dropdownAnimation]
      role="menu"
      [attr.aria-label]="'Menu for ' + user.name"
      class="absolute right-0 top-10 z-50 min-w-[10rem] overflow-hidden rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-gray-800">
      <ul class="py-1">
        <li *ngFor="let option of menuOptions; trackBy: trackByAction" role="none">
          <a
            href="#0"
            role="menuitem"
            tabindex="0"
            (click)="onMenuOptionClick(option, $event)"
            class="flex items-center gap-2 px-4 py-2 text-sm transition"
            [ngClass]="option.isDanger
              ? 'text-red-500 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10'
              : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white'">
            <ng-icon
              [name]="option.isDanger ? 'tablerTrash' : 'tablerEye'"
              size="16"
              class="shrink-0"></ng-icon>
            <span>{{ option.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Body -->
  <div class="flex flex-1 flex-col px-5 pb-5">
    <!-- Avatar + role badge -->
    <div class="-mt-10 mb-3 flex items-end justify-between gap-2">
      <div class="relative">
        <img
          class="h-[72px] w-[72px] rounded-full object-cover ring-4 ring-white shadow-md dark:ring-gray-800"
          [src]="user.avatar"
          [alt]="user.name"
          width="72"
          height="72"
          loading="lazy"
          (click)="$event.stopPropagation()">
        <span
          *ngIf="user.isActive !== undefined"
          class="absolute bottom-1 right-1 block h-3.5 w-3.5 rounded-full ring-2 ring-white dark:ring-gray-800"
          [ngClass]="user.isActive ? 'bg-emerald-500' : 'bg-gray-400 dark:bg-gray-500'"
          [attr.aria-label]="user.isActive ? 'Active' : 'Inactive'"></span>
      </div>

      <span
        *ngIf="user.role || user.countryFlag"
        class="mb-1 inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-[11px] font-medium capitalize ring-1 ring-inset"
        [ngClass]="roleBadgeClass">
        <span *ngIf="user.countryFlag" aria-hidden="true" class="text-sm leading-none">{{ user.countryFlag }}</span>
        <span *ngIf="user.role">{{ user.role }}</span>
      </span>
    </div>

    <!-- Name + department -->
    <h2 class="truncate text-base font-semibold text-gray-800 dark:text-gray-100">{{ user.name }}</h2>
    <div
      *ngIf="user.country"
      class="mt-0.5 flex items-center gap-1 text-xs text-gray-500 dark:text-gray-400">
      <ng-icon name="tablerBriefcase" size="12" class="shrink-0"></ng-icon>
      <span class="truncate">{{ user.country }}</span>
    </div>

    <!-- Info rows -->
    <div class="mt-4 flex-1 space-y-1.5 text-xs text-gray-500 dark:text-gray-400">
      <div *ngIf="user.email" class="flex items-center gap-2 truncate">
        <ng-icon name="tablerMail" size="14" class="shrink-0 text-gray-400 dark:text-gray-500"></ng-icon>
        <span class="truncate">{{ user.email }}</span>
      </div>
      <div *ngIf="user.phone" class="flex items-center gap-2 truncate">
        <ng-icon name="tablerPhone" size="14" class="shrink-0 text-gray-400 dark:text-gray-500"></ng-icon>
        <span class="truncate">{{ user.phone }}</span>
      </div>
      <p
        *ngIf="!user.email && !user.phone && user.bio"
        class="line-clamp-2 leading-relaxed">
        {{ user.bio }}
      </p>
    </div>
  </div>

  <!-- Footer actions -->
  <div
    *ngIf="showSendEmail || showEditProfile"
    class="flex gap-2 border-t border-gray-200 bg-gray-50/60 px-5 py-3 dark:border-gray-700/60 dark:bg-gray-800/40">
    <a
      *ngIf="showSendEmail"
      href="#0"
      (click)="onSendEmail($event)"
      [attr.aria-label]="'Send email to ' + user.name"
      class="flex flex-1 items-center justify-center gap-1.5 rounded-lg bg-violet-500 px-3 py-1.5 text-xs font-medium text-white shadow-sm transition hover:bg-violet-600 hover:shadow focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-400">
      <ng-icon name="tablerMail" size="14"></ng-icon>
      <span>Email</span>
    </a>
    <a
      *ngIf="showEditProfile"
      href="#0"
      (click)="onEditProfile($event)"
      [attr.aria-label]="'Edit profile of ' + user.name"
      class="flex flex-1 items-center justify-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-600 transition hover:bg-gray-50 hover:text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/50 dark:hover:text-white">
      <ng-icon name="tablerEdit" size="14"></ng-icon>
      <span>Edit</span>
    </a>
  </div>
</article>
